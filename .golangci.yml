# golangci-lint configuration (schema v2).
#
# Every build of this project is either `cloud` or `selfhosted`, and whole files
# are excluded by build tags, so a single pass only ever sees one variant.
# `make lint-go` therefore runs golangci-lint once per tag, per module.
#
# No `run.build-tags` is set on purpose. golangci-lint *appends* --build-tags to
# the configured list rather than replacing it, so pinning a default here would
# make `--build-tags cloud` load `cloud` and `selfhosted` together and fail on
# `internal/quota.CalendarCounter` being declared twice. Always pass the tag:
#
#   golangci-lint run --build-tags selfhosted ./...
#   golangci-lint run --build-tags cloud ./...
#
# `pkg/` is a separate Go module. `./...` never crosses a module boundary, so the
# Makefile invokes golangci-lint from inside `pkg/` as well, with --config
# pointing back at this file.
version: "2"

run:
  timeout: 10m
  tests: true

linters:
  default: none
  enable:
    # Correctness
    - govet # the vet suite: printf, copylocks, loopclosure, lostcancel, ...
    - staticcheck # SA/S/ST/QF: bugs, simplifications, style
    - errcheck # unchecked error returns
    - ineffassign # assignments never read
    - unused # dead code, unused fields and methods
    # Resource lifecycle
    - bodyclose # http.Response.Body must be closed
    # rowserrcheck only understands database/sql and sqlx. This codebase queries
    # through pgx, whose Rows is a different type, so it will NOT catch a missing
    # rows.Err() in internal/*/repository — verified by deleting one and re-running.
    # All 16 pgx iteration loops were audited by hand; keep doing that in review.
    - rowserrcheck # rows.Err() must be checked after iterating a result set
    - sqlclosecheck # sql.Rows/sql.Stmt/pgx query results must be closed
    # Context propagation
    - contextcheck # a request-scoped ctx must not be replaced by context.Background()
    - noctx # HTTP requests and queries must carry a context

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
      exclude-functions:
        # Best-effort writes to an already-committed HTTP response: the status
        # line is long gone by the time these fail, so there is nothing to do
        # with the error but drop it.
        - (net/http.ResponseWriter).Write
        - (*net/http.Request).ParseForm
        - (*net/http.Request).ParseMultipartForm

    govet:
      enable-all: true
      disable:
        # Field alignment is a micro-optimisation that fights readability, and
        # this codebase orders struct fields to mirror its SQL columns.
        - fieldalignment
        # `if err := f(); err != nil` inside a function that already has an
        # `err` is the idiomatic Go form and is used throughout. Flagging it
        # would bury the analyzers that find real bugs.
        - shadow

    staticcheck:
      # Defaults minus the package/receiver/naming conventions golangci-lint
      # already omits, kept explicit so the set does not drift with the tool.
      checks:
        - all
        - -ST1000 # package comment on every package
        - -ST1003 # initialisms in names (ID/URL/API) — too noisy to retrofit
        - -ST1016 # consistent receiver names
        - -ST1020 # comment on exported function
        - -ST1021 # comment on exported type
        - -ST1022 # comment on exported var

  exclusions:
    generated: lax
    paths:
      - docs/swagger # generated by `make swagger`
      - web/dist # embedded frontend build output
      - frontend/node_modules
      - node_modules
      - \.go-cache
      - ^path/ # stray local GOPATH-style directory, not project code
      - migrations-build
    rules:
      # The only relaxation for tests, and a narrow one: `httptest.NewRequest` is the
      # idiomatic way to build a request in a test and noctx wants NewRequestWithContext
      # for every one of them (48 call sites). The request it builds already carries a
      # background context; there is no cancellation to propagate in a test body.
      # Everything else — errcheck, staticcheck, unused, govet, contextcheck — applies
      # to `_test.go` exactly as it does to production code.
      - path: _test\.go
        linters:
          - noctx

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
