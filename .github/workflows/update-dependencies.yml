name: Update Dependencies

on:
  schedule:
    # Run daily at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependencies:
    name: Check and Update Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Generate Swagger docs
        run: |
          go install github.com/swaggo/swag/cmd/swag@latest
          swag init -g cmd/main.go -o docs/swagger --parseInternal --generatedTime=false

      # ── Check available updates (from main) ──────────────────────────

      - name: Check Node.js updates
        id: node-updates
        working-directory: frontend
        run: |
          npm install -g npm-check-updates
          UPDATES=$(ncu --jsonUpgraded 2>/dev/null || echo "{}")

          if [ "$UPDATES" == "{}" ] || [ "$UPDATES" == "" ]; then
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "No Node.js updates available"
          else
            echo "has_updates=true" >> $GITHUB_OUTPUT

            echo "## 📦 Node.js Dependencies (frontend/)" > /tmp/node_report.md
            echo "" >> /tmp/node_report.md

            MAJOR_FOUND=false
            MINOR_FOUND=false
            PATCH_FOUND=false

            for pkg in $(echo "$UPDATES" | jq -r 'keys[]'); do
              NEW_VERSION_RAW=$(echo "$UPDATES" | jq -r --arg p "$pkg" '.[$p]')
              CURRENT_VERSION=$(jq -r --arg p "$pkg" '.dependencies[$p] // .devDependencies[$p]' package.json | sed 's/[\^~]//')
              NEW_VERSION=$(echo "$NEW_VERSION_RAW" | sed 's/[\^~]//')

              CURR_MAJOR=$(echo "$CURRENT_VERSION" | cut -d. -f1)
              CURR_MINOR=$(echo "$CURRENT_VERSION" | cut -d. -f2)
              NEW_MAJOR=$(echo "$NEW_VERSION" | cut -d. -f1)
              NEW_MINOR=$(echo "$NEW_VERSION" | cut -d. -f2)

              NPM_URL="https://www.npmjs.com/package/$pkg"

              if [ "$CURR_MAJOR" != "$NEW_MAJOR" ]; then
                echo "- [\`$pkg\`]($NPM_URL): \`$CURRENT_VERSION\` → \`$NEW_VERSION\`" >> /tmp/node_major.md
                MAJOR_FOUND=true
              elif [ "$CURR_MINOR" != "$NEW_MINOR" ]; then
                echo "- [\`$pkg\`]($NPM_URL): \`$CURRENT_VERSION\` → \`$NEW_VERSION\`" >> /tmp/node_minor.md
                MINOR_FOUND=true
              else
                echo "- [\`$pkg\`]($NPM_URL): \`$CURRENT_VERSION\` → \`$NEW_VERSION\`" >> /tmp/node_patch.md
                PATCH_FOUND=true
              fi
            done

            echo "### 🔴 Major Updates" >> /tmp/node_report.md
            echo "" >> /tmp/node_report.md
            if [ "$MAJOR_FOUND" == "true" ]; then
              cat /tmp/node_major.md >> /tmp/node_report.md
            else
              echo "_No major updates_" >> /tmp/node_report.md
            fi

            echo "" >> /tmp/node_report.md
            echo "### 🟡 Minor Updates" >> /tmp/node_report.md
            echo "" >> /tmp/node_report.md
            if [ "$MINOR_FOUND" == "true" ]; then
              cat /tmp/node_minor.md >> /tmp/node_report.md
            else
              echo "_No minor updates_" >> /tmp/node_report.md
            fi

            echo "" >> /tmp/node_report.md
            echo "### 🟢 Patch Updates" >> /tmp/node_report.md
            echo "" >> /tmp/node_report.md
            if [ "$PATCH_FOUND" == "true" ]; then
              cat /tmp/node_patch.md >> /tmp/node_report.md
            else
              echo "_No patch updates_" >> /tmp/node_report.md
            fi
          fi

      - name: Check Go updates (root)
        id: go-updates-root
        run: |
          UPDATES=$(go list -m -u -json all 2>/dev/null | jq -s '[.[] | select(.Update != null) | select(.Indirect != true)]')

          if [ "$UPDATES" == "[]" ] || [ -z "$UPDATES" ]; then
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "No Go updates available for root module"
          else
            echo "has_updates=true" >> $GITHUB_OUTPUT

            echo "## 🐹 Go Dependencies (/go.mod)" > /tmp/go_root_report.md
            echo "" >> /tmp/go_root_report.md

            MAJOR_FOUND=false
            MINOR_FOUND=false
            PATCH_FOUND=false

            for row in $(echo "$UPDATES" | jq -c '.[]'); do
              PKG=$(echo "$row" | jq -r '.Path')
              CURRENT=$(echo "$row" | jq -r '.Version')
              NEW=$(echo "$row" | jq -r '.Update.Version')

              CURR_CLEAN=$(echo "$CURRENT" | sed 's/^v//')
              NEW_CLEAN=$(echo "$NEW" | sed 's/^v//')

              CURR_MAJOR=$(echo "$CURR_CLEAN" | cut -d. -f1)
              CURR_MINOR=$(echo "$CURR_CLEAN" | cut -d. -f2)
              NEW_MAJOR=$(echo "$NEW_CLEAN" | cut -d. -f1)
              NEW_MINOR=$(echo "$NEW_CLEAN" | cut -d. -f2)

              PKG_URL="https://pkg.go.dev/$PKG"

              if [ "$CURR_MAJOR" != "$NEW_MAJOR" ]; then
                echo "- [\`$PKG\`]($PKG_URL): \`$CURRENT\` → \`$NEW\`" >> /tmp/go_root_major.md
                MAJOR_FOUND=true
              elif [ "$CURR_MINOR" != "$NEW_MINOR" ]; then
                echo "- [\`$PKG\`]($PKG_URL): \`$CURRENT\` → \`$NEW\`" >> /tmp/go_root_minor.md
                MINOR_FOUND=true
              else
                echo "- [\`$PKG\`]($PKG_URL): \`$CURRENT\` → \`$NEW\`" >> /tmp/go_root_patch.md
                PATCH_FOUND=true
              fi
            done

            echo "### 🔴 Major Updates" >> /tmp/go_root_report.md
            echo "" >> /tmp/go_root_report.md
            if [ "$MAJOR_FOUND" == "true" ]; then
              cat /tmp/go_root_major.md >> /tmp/go_root_report.md
            else
              echo "_No major updates_" >> /tmp/go_root_report.md
            fi

            echo "" >> /tmp/go_root_report.md
            echo "### 🟡 Minor Updates" >> /tmp/go_root_report.md
            echo "" >> /tmp/go_root_report.md
            if [ "$MINOR_FOUND" == "true" ]; then
              cat /tmp/go_root_minor.md >> /tmp/go_root_report.md
            else
              echo "_No minor updates_" >> /tmp/go_root_report.md
            fi

            echo "" >> /tmp/go_root_report.md
            echo "### 🟢 Patch Updates" >> /tmp/go_root_report.md
            echo "" >> /tmp/go_root_report.md
            if [ "$PATCH_FOUND" == "true" ]; then
              cat /tmp/go_root_patch.md >> /tmp/go_root_report.md
            else
              echo "_No patch updates_" >> /tmp/go_root_report.md
            fi
          fi

      - name: Check Go updates (pkg)
        id: go-updates-pkg
        working-directory: pkg
        run: |
          UPDATES=$(go list -m -u -json all 2>/dev/null | jq -s '[.[] | select(.Update != null) | select(.Indirect != true)]')

          if [ "$UPDATES" == "[]" ] || [ -z "$UPDATES" ]; then
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "No Go updates available for pkg module"
          else
            echo "has_updates=true" >> $GITHUB_OUTPUT

            echo "## 🐹 Go Dependencies (/pkg/go.mod)" > /tmp/go_pkg_report.md
            echo "" >> /tmp/go_pkg_report.md

            MAJOR_FOUND=false
            MINOR_FOUND=false
            PATCH_FOUND=false

            for row in $(echo "$UPDATES" | jq -c '.[]'); do
              PKG=$(echo "$row" | jq -r '.Path')
              CURRENT=$(echo "$row" | jq -r '.Version')
              NEW=$(echo "$row" | jq -r '.Update.Version')

              CURR_CLEAN=$(echo "$CURRENT" | sed 's/^v//')
              NEW_CLEAN=$(echo "$NEW" | sed 's/^v//')

              CURR_MAJOR=$(echo "$CURR_CLEAN" | cut -d. -f1)
              CURR_MINOR=$(echo "$CURR_CLEAN" | cut -d. -f2)
              NEW_MAJOR=$(echo "$NEW_CLEAN" | cut -d. -f1)
              NEW_MINOR=$(echo "$NEW_CLEAN" | cut -d. -f2)

              PKG_URL="https://pkg.go.dev/$PKG"

              if [ "$CURR_MAJOR" != "$NEW_MAJOR" ]; then
                echo "- [\`$PKG\`]($PKG_URL): \`$CURRENT\` → \`$NEW\`" >> /tmp/go_pkg_major.md
                MAJOR_FOUND=true
              elif [ "$CURR_MINOR" != "$NEW_MINOR" ]; then
                echo "- [\`$PKG\`]($PKG_URL): \`$CURRENT\` → \`$NEW\`" >> /tmp/go_pkg_minor.md
                MINOR_FOUND=true
              else
                echo "- [\`$PKG\`]($PKG_URL): \`$CURRENT\` → \`$NEW\`" >> /tmp/go_pkg_patch.md
                PATCH_FOUND=true
              fi
            done

            echo "### 🔴 Major Updates" >> /tmp/go_pkg_report.md
            echo "" >> /tmp/go_pkg_report.md
            if [ "$MAJOR_FOUND" == "true" ]; then
              cat /tmp/go_pkg_major.md >> /tmp/go_pkg_report.md
            else
              echo "_No major updates_" >> /tmp/go_pkg_report.md
            fi

            echo "" >> /tmp/go_pkg_report.md
            echo "### 🟡 Minor Updates" >> /tmp/go_pkg_report.md
            echo "" >> /tmp/go_pkg_report.md
            if [ "$MINOR_FOUND" == "true" ]; then
              cat /tmp/go_pkg_minor.md >> /tmp/go_pkg_report.md
            else
              echo "_No minor updates_" >> /tmp/go_pkg_report.md
            fi

            echo "" >> /tmp/go_pkg_report.md
            echo "### 🟢 Patch Updates" >> /tmp/go_pkg_report.md
            echo "" >> /tmp/go_pkg_report.md
            if [ "$PATCH_FOUND" == "true" ]; then
              cat /tmp/go_pkg_patch.md >> /tmp/go_pkg_report.md
            else
              echo "_No patch updates_" >> /tmp/go_pkg_report.md
            fi
          fi

      - name: Check npm audit vulnerabilities
        id: npm-audit-check
        working-directory: frontend
        run: |
          npm install --package-lock-only --ignore-scripts 2>/dev/null
          AUDIT=$(npm audit --json 2>/dev/null | jq '.metadata.vulnerabilities // empty')
          TOTAL=$(echo "$AUDIT" | jq '[.low, .moderate, .high, .critical] | add // 0' 2>/dev/null || echo "0")

          if [ "$TOTAL" -gt 0 ] 2>/dev/null; then
            echo "has_vulnerabilities=true" >> $GITHUB_OUTPUT
            echo "Found $TOTAL vulnerabilities fixable by npm audit fix"
          else
            echo "has_vulnerabilities=false" >> $GITHUB_OUTPUT
            echo "No vulnerabilities found"
          fi
          git checkout -- . 2>/dev/null || true

      # ── Stop here if nothing to update ───────────────────────────────

      - name: Check if any updates found
        id: any-updates
        run: |
          if [ "${{ steps.node-updates.outputs.has_updates }}" == "true" ] || \
             [ "${{ steps.go-updates-root.outputs.has_updates }}" == "true" ] || \
             [ "${{ steps.go-updates-pkg.outputs.has_updates }}" == "true" ] || \
             [ "${{ steps.npm-audit-check.outputs.has_vulnerabilities }}" == "true" ]; then
            echo "has_updates=true" >> $GITHUB_OUTPUT
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "No updates available, stopping here"
          fi

      # ── Switch to deps branch and apply updates ──────────────────────
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Find or create deps branch
        if: steps.any-updates.outputs.has_updates == 'true'
        id: deps-branch
        run: |
          EXISTING_BRANCH=$(git branch -r | grep 'origin/deps/update-' | head -1 | sed 's/origin\///' | xargs || true)
          if [ -n "$EXISTING_BRANCH" ]; then
            echo "branch=$EXISTING_BRANCH" >> $GITHUB_OUTPUT
            echo "exists=true" >> $GITHUB_OUTPUT
            git checkout "$EXISTING_BRANCH"
            git pull origin "$EXISTING_BRANCH"
            git merge main --no-edit
          else
            BRANCH="deps/update-$(date +'%Y%m%d')"
            echo "branch=$BRANCH" >> $GITHUB_OUTPUT
            echo "exists=false" >> $GITHUB_OUTPUT
            git checkout -b "$BRANCH"
          fi

      - name: Apply Node.js updates
        if: steps.node-updates.outputs.has_updates == 'true'
        working-directory: frontend
        run: |
          ncu -u
          npm install

      - name: Run npm audit fix
        if: steps.npm-audit-check.outputs.has_vulnerabilities == 'true'
        working-directory: frontend
        run: |
          npm install --package-lock-only --ignore-scripts 2>/dev/null
          AUDIT_BEFORE=$(npm audit --json 2>/dev/null | jq '.metadata.vulnerabilities // empty')
          TOTAL_BEFORE=$(echo "$AUDIT_BEFORE" | jq '[.low, .moderate, .high, .critical] | add // 0')

          npm audit fix || true

          AUDIT_AFTER=$(npm audit --json 2>/dev/null | jq '.metadata.vulnerabilities // empty')
          TOTAL_AFTER=$(echo "$AUDIT_AFTER" | jq '[.low, .moderate, .high, .critical] | add // 0')
          FIXED=$((TOTAL_BEFORE - TOTAL_AFTER))

          echo "## 🛡️ Security Audit (npm)" > /tmp/audit_report.md
          echo "" >> /tmp/audit_report.md
          echo "- Vulnerabilities before: **$TOTAL_BEFORE**" >> /tmp/audit_report.md
          echo "- Fixed automatically: **$FIXED**" >> /tmp/audit_report.md
          echo "- Remaining: **$TOTAL_AFTER**" >> /tmp/audit_report.md

          if [ "$TOTAL_AFTER" -gt 0 ]; then
            echo "" >> /tmp/audit_report.md
            echo "⚠️ Some vulnerabilities require manual review." >> /tmp/audit_report.md
          fi

      - name: Apply Go updates (root)
        if: steps.go-updates-root.outputs.has_updates == 'true'
        run: |
          go get -u ./...
          go mod tidy

      - name: Apply Go updates (pkg)
        if: steps.go-updates-pkg.outputs.has_updates == 'true'
        working-directory: pkg
        run: |
          go get -u ./...
          go mod tidy

      - name: Verify build
        if: steps.any-updates.outputs.has_updates == 'true'
        id: build-check
        continue-on-error: true
        run: |
          set -o pipefail
          make build 2>&1 | tee /tmp/build.log

      - name: Generate build report
        if: steps.any-updates.outputs.has_updates == 'true'
        run: |
          echo "## 🛠️ Build Verification (\`make build\`)" > /tmp/build_report.md
          echo "" >> /tmp/build_report.md
          if [ "${{ steps.build-check.outcome }}" == "success" ]; then
            echo "✅ **Build OK** — the project compiles with the updated dependencies." >> /tmp/build_report.md
          else
            echo "❌ **Build KO** — the project failed to compile with the updated dependencies. Manual review required." >> /tmp/build_report.md
            echo "" >> /tmp/build_report.md
            echo "<details><summary>Last 50 lines of build output</summary>" >> /tmp/build_report.md
            echo "" >> /tmp/build_report.md
            echo '```' >> /tmp/build_report.md
            tail -n 50 /tmp/build.log >> /tmp/build_report.md
            echo '```' >> /tmp/build_report.md
            echo "</details>" >> /tmp/build_report.md
          fi

      - name: Check for changes
        if: steps.any-updates.outputs.has_updates == 'true' || steps.npm-audit-check.outputs.has_vulnerabilities == 'true'
        id: changes
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git add -A
          git commit -m "chore(deps): update dependencies $(date +'%Y-%m-%d')"
          git push origin ${{ steps.deps-branch.outputs.branch }}

      # ── Generate PR body & create/update PR ──────────────────────────

      - name: Generate PR body
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          echo "# 🔄 Dependency Updates" > /tmp/final_pr_body.md
          echo "" >> /tmp/final_pr_body.md
          echo "This PR contains automated dependency updates." >> /tmp/final_pr_body.md
          echo "" >> /tmp/final_pr_body.md

          if [ -f /tmp/node_report.md ]; then
            cat /tmp/node_report.md >> /tmp/final_pr_body.md
            echo "" >> /tmp/final_pr_body.md
          fi

          if [ -f /tmp/go_root_report.md ]; then
            cat /tmp/go_root_report.md >> /tmp/final_pr_body.md
            echo "" >> /tmp/final_pr_body.md
          fi

          if [ -f /tmp/go_pkg_report.md ]; then
            cat /tmp/go_pkg_report.md >> /tmp/final_pr_body.md
            echo "" >> /tmp/final_pr_body.md
          fi

          if [ -f /tmp/audit_report.md ]; then
            cat /tmp/audit_report.md >> /tmp/final_pr_body.md
            echo "" >> /tmp/final_pr_body.md
          fi

          if [ -f /tmp/build_report.md ]; then
            cat /tmp/build_report.md >> /tmp/final_pr_body.md
            echo "" >> /tmp/final_pr_body.md
          fi

          echo "" >> /tmp/final_pr_body.md
          echo "_Generated automatically by the dependency update workflow._" >> /tmp/final_pr_body.md

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true' && steps.deps-branch.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "chore(deps): Update dependencies" \
            --body-file /tmp/final_pr_body.md \
            --base main \
            --head ${{ steps.deps-branch.outputs.branch }}

      - name: Update Pull Request
        if: steps.changes.outputs.has_changes == 'true' && steps.deps-branch.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list --head "${{ steps.deps-branch.outputs.branch }}" --json number --jq '.[0].number')
          gh pr edit "$PR_NUMBER" \
            --body-file /tmp/final_pr_body.md
