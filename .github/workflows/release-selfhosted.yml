# WhenTo Self-hosted - GitHub Actions workflow for GitHub Container Registry
# Copyright (C) 2025 WhenTo Contributors
# SPDX-License-Identifier: BSL-1.1
#
# This workflow builds and publishes:
# - Docker image to ghcr.io (scanned before it is pushed, with an SBOM and a signed
#   provenance attestation)
# - Native binaries for Linux, Windows, and macOS
# Triggered on version tags (v1.0.0, v2.1.3, etc.)
#
# Actions are pinned to full commit SHAs, tag in the trailing comment. This workflow
# holds `packages: write`, `contents: write` and `id-token: write`; a mutable major tag
# would put all three at the disposal of whoever can move it.

name: Release Self-hosted

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: read

# One release at a time per tag, and never cancelled: a half-published release leaves
# some artefacts uploaded and some not.
concurrency:
  group: release-selfhosted-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GO_VERSION: '1.26'
  NODE_VERSION: '24'

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend for self-hosted
        working-directory: frontend
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-dist-selfhosted
          path: frontend/dist
          retention-days: 1

  generate-swagger:
    name: Generate Swagger Docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install swag CLI
        run: go install github.com/swaggo/swag/cmd/swag@v1.16.6

      - name: Generate Swagger docs
        run: swag init -g cmd/main.go -o docs/swagger --parseInternal --generatedTime=false

      - name: Upload Swagger docs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: swagger-docs-selfhosted
          path: docs/swagger
          retention-days: 1

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [build-frontend, generate-swagger]
    permissions:
      contents: read
      packages: write
      # For the signed provenance attestation below.
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download frontend build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-dist-selfhosted
          path: frontend/dist

      - name: Download Swagger docs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: swagger-docs-selfhosted
          path: docs/swagger

      - name: Extract version from tag
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          # Remove 'v' prefix for Docker tag
          VERSION_NUM=${VERSION#v}
          # The registry rejects an upper-case path, and github.repository is not
          # guaranteed to be lower case.
          IMAGE=$(echo "${REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
          {
            echo "tag=${VERSION}"
            echo "version=${VERSION_NUM}"
            echo "image=${IMAGE}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}
            type=semver,pattern={{version}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.tag }}
          labels: |
            org.opencontainers.image.description=WhenTo - Self-hosted scheduling and calendar application
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}#readme
            org.opencontainers.image.vendor=WhenTo Contributors
            org.opencontainers.image.licenses=BSL-1.1

      # Scanned before the push, so a release image with a fixable critical CVE never
      # reaches the registry under `latest`. Only the amd64 image is loaded and scanned;
      # the two architectures share a Dockerfile and a base image, so an arm64-only
      # finding is not a thing this scan can miss. The push below reuses these layers
      # from the gha cache.
      - name: Build image for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: build/selfhosted/Dockerfile
          push: false
          load: true
          tags: whento-scan:candidate
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ignore-unfixed, because an advisory with no released fix is not something this
      # build can act on. Findings stay in the job log; nothing is uploaded.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: whento-scan:candidate
          format: table
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: build/selfhosted/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          platforms: linux/amd64,linux/arm64
          # In-registry SPDX SBOM and build provenance, readable with
          # `docker buildx imagetools inspect --format '{{ json .SBOM }}'`.
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The signed, GitHub-issued attestation — `gh attestation verify oci://…` proves
      # this digest came out of this workflow at this commit.
      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.version.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Summary
        run: |
          {
            echo "## Self-hosted image published"
            echo ""
            echo "**Registry:** GitHub Container Registry"
            echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`"
            echo "**Tags:** \`latest\`, \`${{ steps.version.outputs.version }}\`"
            echo "**Digest:** \`${{ steps.push.outputs.digest }}\`"
            echo ""
            echo "### Pull command"
            echo '```bash'
            echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build-binaries:
    name: Build Binaries (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-frontend, generate-swagger]
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ''
          - goos: linux
            goarch: arm64
            suffix: ''
          - goos: windows
            goarch: amd64
            suffix: '.exe'
          - goos: darwin
            goarch: amd64
            suffix: ''
          - goos: darwin
            goarch: arm64
            suffix: ''
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download frontend build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-dist-selfhosted
          path: web/dist

      - name: Download Swagger docs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: swagger-docs-selfhosted
          path: docs/swagger

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Extract version from tag
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          VERSION_NUM=${VERSION#v}
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION_NUM}" >> "$GITHUB_OUTPUT"

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          VCS_REF=$(git rev-parse --short HEAD)

          LDFLAGS="-s -w -X main.Version=${VERSION} -X main.BuildDate=${BUILD_DATE} -X main.VCSRef=${VCS_REF}"

          go build -tags selfhosted -ldflags="${LDFLAGS}" -o whento${{ matrix.suffix }} ./cmd

          echo "Binary built: whento${{ matrix.suffix }}"
          ls -la whento${{ matrix.suffix }}

      - name: Create archive (Unix)
        if: matrix.goos != 'windows'
        id: archive-unix
        run: |
          ARCHIVE_NAME="whento-${{ steps.version.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          tar -czvf "${ARCHIVE_NAME}" whento
          echo "archive_name=${ARCHIVE_NAME}" >> "$GITHUB_OUTPUT"
          echo "Archive created: ${ARCHIVE_NAME}"
          ls -la "${ARCHIVE_NAME}"

      - name: Create archive (Windows)
        if: matrix.goos == 'windows'
        id: archive-windows
        run: |
          ARCHIVE_NAME="whento-${{ steps.version.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}.zip"
          zip "${ARCHIVE_NAME}" whento.exe
          echo "archive_name=${ARCHIVE_NAME}" >> "$GITHUB_OUTPUT"
          echo "Archive created: ${ARCHIVE_NAME}"
          ls -la "${ARCHIVE_NAME}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: whento-${{ matrix.goos }}-${{ matrix.goarch }}
          path: whento-${{ steps.version.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.zip' || '.tar.gz' }}
          retention-days: 5

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-and-push, build-binaries]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      # For the signed provenance attestation over the release archives.
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          set -euo pipefail
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION_NUM=${VERSION#v}
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION_NUM}" >> "$GITHUB_OUTPUT"

      # Most tags in this repository are lightweight, and `git tag -l -n999` prints the
      # *commit* message for those — which is how the v1.6.3 release body came to be
      # prefixed with sixteen lines of "update dependencies". Only an annotated tag
      # carries a message of its own; anything else falls back to the notes the release
      # action generates from the commit range (generate_release_notes below).
      - name: Extract tag message
        id: tag_message
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          TYPE=$(git cat-file -t "refs/tags/${TAG}" 2>/dev/null || echo "missing")
          if [ "$TYPE" != "tag" ]; then
            echo "${TAG} is a ${TYPE} tag, not an annotated one: using generated notes only"
            echo "has_message=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # contents:subject/body rather than contents, so a signed tag does not drag
          # its PGP block into the release body.
          git for-each-ref "refs/tags/${TAG}" \
            --format='%(contents:subject)%0a%0a%(contents:body)' > tag_message.txt
          if grep -q '[^[:space:]]' tag_message.txt; then
            echo "has_message=true" >> "$GITHUB_OUTPUT"
          else
            echo "annotated tag ${TAG} has an empty message: using generated notes only"
            echo "has_message=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          pattern: whento-*

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release/ \;
          ls -la release/

      # The SBOM is taken from the linux/amd64 binary itself rather than from go.mod, so
      # it lists what was actually linked in. Syft reads the Go build info embedded in
      # the binary; nothing about the machine that built it is included.
      - name: Extract binary for the SBOM
        run: |
          set -euo pipefail
          mkdir -p sbom-input
          tar -xzf "release/whento-${{ steps.version.outputs.version }}-linux-amd64.tar.gz" \
            -C sbom-input whento

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: sbom-input/whento
          format: spdx-json
          output-file: release/whento-${{ steps.version.outputs.version }}-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate checksums
        working-directory: release
        run: |
          set -euo pipefail
          sha256sum -- * > checksums.txt
          cat checksums.txt

      # Signed provenance for every published file: `gh attestation verify <file> --repo
      # <owner>/<repo>` says which workflow, at which commit, produced it.
      - name: Attest release artefacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.tar.gz
            release/*.zip
            release/*.spdx.json

      - name: Create release body
        id: release_body
        run: |
          set -euo pipefail
          : > release_body.md
          # Prepend the annotated tag message when there is one
          if [ "${{ steps.tag_message.outputs.has_message }}" = "true" ]; then
            cat tag_message.txt > release_body.md
            {
              echo ""
              echo "---"
              echo ""
            } >> release_body.md
          fi
          # Append installation instructions
          cat >> release_body.md << 'EOF'
          ## Installation

          ### Docker (recommended)

          ```bash
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          ```

          ### Binary Installation

          Download the appropriate binary for your platform:

          | Platform | Architecture | Download |
          |----------|--------------|----------|
          | Linux | x86_64 (amd64) | `whento-${{ steps.version.outputs.version }}-linux-amd64.tar.gz` |
          | Linux | ARM64 | `whento-${{ steps.version.outputs.version }}-linux-arm64.tar.gz` |
          | Windows | x86_64 (amd64) | `whento-${{ steps.version.outputs.version }}-windows-amd64.zip` |
          | macOS | Intel (amd64) | `whento-${{ steps.version.outputs.version }}-darwin-amd64.tar.gz` |
          | macOS | Apple Silicon (arm64) | `whento-${{ steps.version.outputs.version }}-darwin-arm64.tar.gz` |

          #### Linux/macOS

          ```bash
          # Download and extract
          tar -xzf whento-${{ steps.version.outputs.version }}-linux-amd64.tar.gz

          # Make executable (if needed)
          chmod +x whento

          # Run
          ./whento
          ```

          #### Windows

          ```powershell
          # Extract the zip file and run
          .\whento.exe
          ```

          ### Verify checksums

          ```bash
          sha256sum -c checksums.txt
          ```

          ### Verify provenance

          Every archive, and the image itself, carries a signed build attestation:

          ```bash
          gh attestation verify whento-${{ steps.version.outputs.version }}-linux-amd64.tar.gz \
            --repo ${{ github.repository }}
          gh attestation verify oci://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }} \
            --repo ${{ github.repository }}
          ```

          A software bill of materials for the Linux binary is published alongside the
          archives as `whento-${{ steps.version.outputs.version }}-sbom.spdx.json`.

          See [README](https://github.com/${{ github.repository }}#readme) for configuration and deployment instructions.
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          generate_release_notes: true
          body_path: release_body.md
          files: |
            release/*

      - name: Summary
        run: |
          {
            echo "## Release ${{ steps.version.outputs.tag }} published"
            echo ""
            echo "### Docker Image"
            echo '```bash'
            echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}"
            echo '```'
            echo ""
            echo "### Binary Downloads"
            echo "- Linux (amd64): \`whento-${{ steps.version.outputs.version }}-linux-amd64.tar.gz\`"
            echo "- Linux (arm64): \`whento-${{ steps.version.outputs.version }}-linux-arm64.tar.gz\`"
            echo "- Windows (amd64): \`whento-${{ steps.version.outputs.version }}-windows-amd64.zip\`"
            echo "- macOS (Intel): \`whento-${{ steps.version.outputs.version }}-darwin-amd64.tar.gz\`"
            echo "- macOS (Apple Silicon): \`whento-${{ steps.version.outputs.version }}-darwin-arm64.tar.gz\`"
            echo "- SBOM: \`whento-${{ steps.version.outputs.version }}-sbom.spdx.json\`"
          } >> "$GITHUB_STEP_SUMMARY"
