# Copyright (C) 2025 WhenTo Contributors
# SPDX-License-Identifier: BSL-1.1
#
# Replaces the hand-rolled update-dependencies.yml workflow, which only
# covered Go and npm. The image tags and action versions it never looked at
# were the ones that had drifted the furthest behind.
#
# Note: security updates are NOT configured here. They are a repository
# setting (Settings -> Code security -> Dependabot security updates) and must
# be enabled there, otherwise the npm audit coverage of the old workflow is
# lost.

version: 2
updates:
  # ── Go: a two-module workspace (/, /pkg) wired together by go.work ──────
  - package-ecosystem: gomod
    directories: ['/', '/pkg']
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    # Labels are what the pull request list is filtered by; without them every
    # Dependabot pull request looks like every other one. Dependabot creates a
    # label it does not find, so no repository setup is needed first.
    labels: ['dependencies', 'go']
    # The old workflow ran `go get -u ./...`, which also moves indirect
    # dependencies. Dependabot only tracks direct ones by default, so ask for
    # everything to keep the same coverage. The group below folds it all into
    # a single pull request anyway.
    allow:
      - dependency-type: all
    groups:
      go:
        applies-to: version-updates
        update-types: [minor, patch]
    ignore:
      # Local module, resolved through `replace ... => ./pkg`.
      - dependency-name: github.com/whento/pkg

  # ── Frontend ────────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    labels: ['dependencies', 'frontend']
    # The default is `auto`, which leaves the choice to Dependabot. Be explicit
    # instead: bump the range declared in package.json to the version that was
    # actually tested, rather than only touching package-lock.json. A fresh
    # `npm install` resolves against the range, so the two must not drift.
    versioning-strategy: increase
    groups:
      frontend:
        applies-to: version-updates
        update-types: [minor, patch]
    ignore:
      # typescript-eslint 8.x declares the peer range >=4.8.4 <6.1.0, and no
      # TypeScript 7 compatible release exists yet. Lift this once it ships.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # The runtime is Node 24 LTS everywhere; types must not run ahead of it.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  # ── Workflow actions ────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'chore(ci)'
    labels: ['dependencies', 'ci']
    groups:
      actions:
        patterns: ['*']

  # ── Image tags in every Dockerfile ──────────────────────────────────────
  # build/selfhosted and build/cloud are the ones CI and the release workflow
  # actually build; the root Dockerfile only backs the make docker-* targets.
  - package-ecosystem: docker
    directories:
      - /
      - /.devcontainer
      - /build/selfhosted
      - /build/cloud
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'chore(deps)'
    labels: ['dependencies', 'docker']
    ignore:
      # Node 26 is Current, not LTS. Stay on 24.
      - dependency-name: node
        update-types: [version-update:semver-major]

  # ── Image tags in the compose files ─────────────────────────────────────
  - package-ecosystem: docker-compose
    directories: ['/', '/.devcontainer']
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'chore(deps)'
    labels: ['dependencies', 'docker']
    ignore:
      # A Postgres major upgrade cannot read the existing data volume, so it
      # needs a dump/restore and a release note for self-hosted users. Redis
      # rides along in the same piece of work. Lift both when that is ready.
      - dependency-name: postgres
        update-types: [version-update:semver-major]
      - dependency-name: redis
        update-types: [version-update:semver-major]

  # ── Dev container features ──────────────────────────────────────────────
  # devcontainer.json pins ghcr.io/devcontainers/features/* by major version
  # only, and devcontainer-lock.json records what that resolved to. Nothing was
  # updating either, so the lockfile drifted away from every other pinned
  # toolchain in the repository. The base image itself is covered by the docker
  # ecosystem above, which also watches /.devcontainer.
  # The directory is the repository root on purpose: the devcontainers fetcher
  # discovers .devcontainer.json, .devcontainer/devcontainer.json and
  # .devcontainer/*/devcontainer.json relative to it. Pointing it at
  # /.devcontainer would make it look one level too deep and find nothing.
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'chore(deps)'
    labels: ['dependencies', 'devcontainer']
