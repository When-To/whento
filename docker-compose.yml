# WhenTo - production stack: app + PostgreSQL + Redis.
#
# Hardening applied here, and the reasoning behind it, is documented in
# docs/hardening-docker.md. Two things are worth reading before the first
# `docker compose up`:
#   - docs/backup-restore.md  — `docker compose down -v` DELETES postgres_data,
#     redis_data and whento_keys. There is no undo.
#   - docs/upgrade-postgres-redis.md — a Postgres major upgrade cannot read the
#     existing data volume; it needs a dump and a restore.

services:
  app:
    image: ghcr.io/when-to/whento:latest
    container_name: whento-app
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      # Application
      - APP_ENV=${APP_ENV:-production}
      - APP_URL=${APP_URL:-http://localhost:8080} # Will be use in e-mail
      - PORT=8080
      - LOG_LEVEL=${LOG_LEVEL:-info}

      # Database
      - DATABASE_URL=postgres://${DB_USER:-whento}:${DB_PASSWORD:?Database password required}@postgres:5432/${DB_NAME:-whento}?sslmode=disable

      # Redis
      - REDIS_URL=redis://:${REDIS_PASSWORD:?Redis password required}@redis:6379/0

      # JWT - Keys are auto-generated on first start
      - JWT_PRIVATE_KEY_PATH=/app/keys/private.pem
      - JWT_PUBLIC_KEY_PATH=/app/keys/public.pem
      - JWT_ACCESS_EXPIRY=${JWT_ACCESS_EXPIRY:-15m}
      - JWT_REFRESH_EXPIRY=${JWT_REFRESH_EXPIRY:-168h}

      # Rate Limiting
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}

      # Security
      - CORS_ORIGINS=${CORS_ORIGINS:-${APP_URL:-http://localhost:8080}}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}

      # SMTP (TLS is implied by SMTP_PORT: 465 = implicit TLS, otherwise STARTTLS)
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-WhenTo}

      # Registration
      - EMAIL_VERIFICATION_ENABLED=${EMAIL_VERIFICATION_ENABLED:-true}
      - ALLOWED_REGISTER=${ALLOWED_REGISTER:-true}
      - ALLOWED_EMAILS=${ALLOWED_EMAILS:-*}
    volumes:
      # The JWT signing keys are generated on first start by the entrypoint. Without
      # this volume they live in the container's writable layer, so every `docker
      # compose up` that recreates the container (image update, changed env var)
      # mints a new key pair and invalidates every issued token: all users are
      # logged out. Participant links are unaffected — they authorise by the link
      # itself, not by a signed token.
      - whento_keys:/app/keys
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - whento-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # The image already runs as the unprivileged `whento` user and listens on
    # 8080, so it needs no capability at all: nothing here binds a privileged
    # port, changes uid, or touches a device.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    # Compose v2 applies these on a plain `docker compose up`; they are not
    # swarm-only. Sized for a small self-hosted instance — raise them rather
    # than remove them if the container gets OOM-killed under real load.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    # A read-only root filesystem is *not* enabled by default: it has not been
    # verified against a running container here. The application itself writes
    # nothing outside /app/keys (which is the named volume above), and the
    # entrypoint only writes the generated key pair, so the block below is the
    # expected shape. Enable it on a staging stack first and confirm the
    # container reaches a healthy state.
    #   read_only: true
    #   tmpfs:
    #     - /tmp:rw,noexec,nosuid,size=16m

  postgres:
    image: postgres:16-alpine
    container_name: whento-postgres
    environment:
      - POSTGRES_DB=${DB_NAME:-whento}
      - POSTGRES_USER=${DB_USER:-whento}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?Database password required}
    volumes:
      # Named local volume. `docker compose down -v` destroys it, and with it
      # every calendar in the instance. See docs/backup-restore.md.
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - whento-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-whento} -d ${DB_NAME:-whento}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    shm_size: 128mb
    security_opt:
      - no-new-privileges:true
    # The official entrypoint starts as root, fixes ownership of the data
    # directory and then drops to the `postgres` user. That needs exactly these
    # five capabilities: dropping ALL without adding them back leaves the
    # container unable to start. Do not trim the list without testing a first
    # start on an empty volume, which is the case that needs them all.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    pids_limit: 512
    deploy:
      resources:
        limits:
          cpus: "1.0"
          # Postgres is the component that suffers most from an undersized
          # limit: it is a hard ceiling, and the server sizes nothing from it.
          # Raise this together with shared_buffers if the instance grows.
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: whento-redis
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Redis password required}
      # redis-cli reads REDISCLI_AUTH from the environment, which is what keeps
      # the healthcheck below from putting the password in a command line.
      - REDISCLI_AUTH=${REDIS_PASSWORD:?Redis password required}
    # The password used to be passed as `--requirepass <value>`, which put it in
    # the container's process list (visible to anything running in the container
    # and in `docker inspect`). It is now written to a 0600 config file at
    # startup and read from there; the command line holds only the variable name.
    #
    # `user: redis` is required by this form: the image's entrypoint only drops
    # privileges when its first argument is literally `redis-server`, so without
    # it the server would run as root. The data directory is already owned by
    # `redis` in the image and in any volume this stack has created.
    user: redis
    command:
      - sh
      - -c
      - |
        umask 077
        printf 'requirepass "%s"\nmaxmemory 256mb\nmaxmemory-policy allkeys-lru\n' "$$REDIS_PASSWORD" > /tmp/redis.conf
        exec redis-server /tmp/redis.conf
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - whento-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    # Running as `redis` from the start, so the entrypoint's chown pass never
    # runs and no capability is needed.
    cap_drop:
      - ALL
    pids_limit: 128
    deploy:
      resources:
        limits:
          cpus: "0.5"
          # Above `maxmemory 256mb` on purpose: the limit has to cover the
          # dataset, copy-on-write during a background save, and the allocator's
          # fragmentation. A limit equal to maxmemory gets the process
          # OOM-killed instead of evicting keys.
          memory: 512M

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  # JWT signing keys. Deleting this volume logs every user out.
  whento_keys:
    driver: local

networks:
  whento-network:
    driver: bridge
