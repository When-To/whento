<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhenTo - Recurring Date Poll & Collaborative Calendar | Free Doodle Alternative</title>
    <meta name="description" content="Free recurring date poll and collaborative calendar. Best Doodle alternative for scheduling regular events: RPG sessions, sports, music rehearsals. Automatic iCal sync with Google Calendar, Outlook.">
    <meta name="keywords" content="date poll, recurring date poll, collaborative calendar, doodle alternative, framadate alternative, find common date, collaborative planning, recurring availability, event scheduling, ical sync, sondage de date, sondage date récurrent, calendrier collaboratif, planning collaboratif">

    <!-- Alternate language versions -->
    <link rel="alternate" hreflang="en" href="https://whento.be/" />
    <link rel="alternate" hreflang="fr" href="https://whento.be/?lang=fr" />
    <link rel="alternate" hreflang="x-default" href="https://whento.be/" />

    <!--
      Inter is bundled, not fetched from fonts.googleapis.com. That request was a
      render-blocking stylesheet on a third-party host: a self-hosted instance
      behind a firewall waited for it to time out before painting anything, and
      every visitor's IP address went to Google — which is the one thing this
      product promises not to do with an address. See docs/adr/0005.
    -->

    <!--
      Resolve the theme before the first paint.

      The app also does this on mount, but "on mount" is after the bundle has been
      fetched, parsed and hydrated — so every dark-theme user saw a full light-coloured
      flash first. This must stay in step with resolveTheme() in src/utils/theme.ts.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* private mode / storage disabled: fall through to the light default */
        }
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
